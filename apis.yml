aid: coolcollege
name: 酷学院 (Cool College)
description: >-
  酷学院 (Cool College) is an enterprise training and talent-development SaaS platform operated by
  酷渲（北京）科技发展有限公司 (Cool Render (Beijing) Technology Co., Ltd.), founded in 2017 and acquired by
  Beisen in 2025. It provides AI-assisted corporate e-learning — course libraries, learning tasks,
  learning projects, exams, certificates, credits, and instructor management — with deep integration
  into DingTalk, Feishu, and WeChat Work. Its Open API (v2) lets integrators sync organization data
  (users, departments, positions) and read learning, exam, certificate, credit, and archive data for
  an enterprise tenant, authenticated via an HMAC-SHA256 signature exchange that issues an access_token.
