    get:
      tags:
      - 学习
      summary: 获取访问接口所需的access_token
      description: 获取访问接口所需的access_token
      parameters:
      - name: api_key
        in: query
        description: apiKey
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: api_secret
        in: query
        description: apiSecret
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: timestamp
        in: query
        description: 13位时间戳, 精确到毫秒
        required: true
        style: form
        explode: true
        schema:
          type: number
      - name: signature
        in: query
        description: 以timestamp 和 ```\n``` 和 apiKey签名字符串，apiSecret为签名密钥，使用算法HmacSHA256计算的签名值。注意：计算出签名以后，需要进行urlencode，才能把签名参数拼接到url中
        required: true
        style: form
        explode: true
        schema:
          type: string
